<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1e38"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2018"/>
      <stop offset="100%" stop-color="#0a1812"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221508"/>
      <stop offset="100%" stop-color="#1a1006"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#130c24"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#200e0e"/>
      <stop offset="100%" stop-color="#180a0a"/>
    </linearGradient>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3a6aaa"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3a8050"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a03030"/>
    </marker>
    <marker id="arrowP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7050b0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="580" fill="url(#bg)" rx="14"/>
  <rect width="960" height="580" fill="none" stroke="#1a2438" stroke-width="1" rx="14"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" fill="#e8edf8" font-size="14" font-weight="bold" font-family="Georgia, serif" letter-spacing="2">MULTI-TIER NETWORK ARCHITECTURE</text>
  <text x="480" y="52" text-anchor="middle" fill="#2a3a55" font-size="9" font-family="'Courier New', monospace" letter-spacing="3">GCP — PRODUCTION-VPC — US-CENTRAL1 — ZERO TRUST</text>
  <line x1="60" y1="62" x2="900" y2="62" stroke="#1a2438" stroke-width="1"/>

  <!-- INTERNET -->
  <rect x="380" y="74" width="200" height="44" rx="8" fill="url(#gBlue)" stroke="#2a4a70" stroke-width="1.5"/>
  <text x="480" y="93" text-anchor="middle" fill="#4a80c0" font-size="9" letter-spacing="2" font-family="'Courier New', monospace">PUBLIC</text>
  <text x="480" y="109" text-anchor="middle" fill="#e8edf8" font-size="13" font-weight="bold" font-family="Georgia, serif">Internet</text>

  <!-- Arrow to LB -->
  <line x1="480" y1="120" x2="480" y2="148" stroke="#3a6aaa" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- Global LB -->
  <rect x="280" y="152" width="400" height="56" rx="8" fill="url(#gBlue)" stroke="#3a6aaa" stroke-width="2"/>
  <rect x="280" y="152" width="400" height="4" rx="2" fill="#3a6aaa"/>
  <text x="480" y="175" text-anchor="middle" fill="#5a9ad4" font-size="9" letter-spacing="2" font-family="'Courier New', monospace">GLOBAL HTTP(S) LOAD BALANCER</text>
  <text x="480" y="196" text-anchor="middle" fill="#e8edf8" font-size="12" font-weight="bold" font-family="Georgia, serif">Health-based routing · HTTP:80</text>

  <!-- Arrow LB to web -->
  <line x1="480" y1="210" x2="480" y2="242" stroke="#3a6aaa" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- VPC wrapper -->
  <rect x="40" y="246" width="880" height="294" rx="10" fill="#0a0f18" stroke="#1e2a40" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="62" y="266" fill="#1e2a40" font-size="9" letter-spacing="2" font-family="'Courier New', monospace">production-vpc — custom mode — us-central1</text>

  <!-- WEB TIER -->
  <rect x="60" y="274" width="860" height="70" rx="6" fill="url(#gGreen)" stroke="#2a7040" stroke-width="1.5"/>
  <text x="80" y="294" fill="#3a9060" font-size="9" letter-spacing="1" font-family="'Courier New', monospace">WEB TIER — 10.0.1.0/24 — PUBLIC HTTP/HTTPS</text>
  <rect x="340" y="300" width="280" height="36" rx="5" fill="#0c1a10" stroke="#3a8050" stroke-width="1.5"/>
  <text x="480" y="316" text-anchor="middle" fill="#5ab87a" font-size="9" letter-spacing="1" font-family="'Courier New', monospace">web-server-1 · e2-micro</text>
  <text x="480" y="330" text-anchor="middle" fill="#e8edf8" font-size="11" font-weight="bold" font-family="Georgia, serif">10.0.1.2 · External IP: Yes · Apache</text>

  <!-- Arrow web to app -->
  <line x1="480" y1="346" x2="480" y2="372" stroke="#3a8050" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="488" y="364" fill="#3a8050" font-size="8" font-family="'Courier New', monospace">:8080</text>

  <!-- APP TIER -->
  <rect x="60" y="374" width="860" height="70" rx="6" fill="url(#gOrange)" stroke="#805020" stroke-width="1.5"/>
  <text x="80" y="394" fill="#a06828" font-size="9" letter-spacing="1" font-family="'Courier New', monospace">APPLICATION TIER — 10.0.2.0/24 — PRIVATE ONLY</text>
  <rect x="340" y="400" width="280" height="36" rx="5" fill="#1a1006" stroke="#a06828" stroke-width="1.5"/>
  <text x="480" y="416" text-anchor="middle" fill="#d4964e" font-size="9" letter-spacing="1" font-family="'Courier New', monospace">app-server-1 · e2-micro</text>
  <text x="480" y="430" text-anchor="middle" fill="#e8edf8" font-size="11" font-weight="bold" font-family="Georgia, serif">10.0.2.2 · External IP: NONE · Python</text>

  <!-- DATA TIER -->
  <rect x="60" y="460" width="560" height="60" rx="6" fill="url(#gPurple)" stroke="#604090" stroke-width="1.5"/>
  <text x="80" y="480" fill="#8060c0" font-size="9" letter-spacing="1" font-family="'Courier New', monospace">DATA TIER — 10.0.3.0/24 — PRIVATE ONLY</text>
  <text x="340" y="498" text-anchor="middle" fill="#a080d8" font-size="10" font-family="'Courier New', monospace">Reserved for database layer · No instances deployed</text>

  <!-- MANAGEMENT TIER -->
  <rect x="640" y="460" width="280" height="60" rx="6" fill="url(#gRed)" stroke="#803030" stroke-width="1.5"/>
  <text x="660" y="480" fill="#a04040" font-size="9" letter-spacing="1" font-family="'Courier New', monospace">MGMT — 10.0.10.0/24 — SSH ONLY</text>
  <rect x="660" y="486" width="240" height="26" rx="4" fill="#180a0a" stroke="#803030" stroke-width="1"/>
  <text x="780" y="497" text-anchor="middle" fill="#e05050" font-size="9" letter-spacing="1" font-family="'Courier New', monospace">bastion-host · e2-micro</text>
  <text x="780" y="508" text-anchor="middle" fill="#e8edf8" font-size="10" font-weight="bold" font-family="Georgia, serif">10.0.10.2 · External IP: Yes</text>

  <!-- Bastion arrow to web/app -->
  <line x1="638" y1="496" x2="624" y2="318" stroke="#803030" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowR)"/>
  <text x="598" y="410" fill="#803030" font-size="8" font-family="'Courier New', monospace">SSH</text>

  <!-- BLOCKED label for internet to app -->
  <rect x="800" y="390" width="80" height="22" rx="4" fill="#200808" stroke="#a02020" stroke-width="1"/>
  <text x="840" y="405" text-anchor="middle" fill="#e03030" font-size="9" font-family="'Courier New', monospace">BLOCKED</text>
  <line x1="840" y1="374" x2="840" y2="388" stroke="#a02020" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="840" y="370" text-anchor="middle" fill="#a02020" font-size="8" font-family="'Courier New', monospace">Internet</text>

</svg>
